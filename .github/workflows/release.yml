name: Release (Developer ID, notarisiert)

# Nur von Hand starten: ein Lauf auf macos-26 verbraucht Actions-Minuten.
# Die Secrets legt Nils unter Settings > Secrets and variables > Actions an (docs/RELEASE.md, 3b).
on:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          [ -n "$CERT_P12" ] || { echo "Secret DEVELOPER_ID_CERT_P12 fehlt (docs/RELEASE.md, 3b)"; exit 1; }
          KC="$RUNNER_TEMP/release.keychain-db"
          KCPW="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
      - name: Store notarytool profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials wattspur-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
      - name: Write Config/Local.xcconfig
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "WATTSPUR_MAC_DISTRIBUTION = developer-id"
            echo "WATTSPUR_NOTARY_PROFILE = wattspur-notary"
          } > Config/Local.xcconfig
      - name: Build, notarize, staple
        run: scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Wattspur-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
