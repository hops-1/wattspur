name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit-tests:
    name: WattspurKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check architecture rules
        run: scripts/check-architecture.sh
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Run tests
        working-directory: Packages/WattspurKit
        # One test at a time: on macOS 26 SwiftData sometimes traps when many in-memory
        # containers are created in parallel (signal 5); macOS 27 is not affected.
        # A backtrace shows the place if a crash comes back.
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
        run: swift test --no-parallel

  app-build:
    name: Build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project Wattspur.xcodeproj -scheme Wattspur \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build/xcode build
