name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit-tests:
    name: WattspurKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Run tests
        working-directory: Packages/WattspurKit
        run: swift test

  app-build:
    name: Build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project Wattspur.xcodeproj -scheme Wattspur \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build/xcode build
