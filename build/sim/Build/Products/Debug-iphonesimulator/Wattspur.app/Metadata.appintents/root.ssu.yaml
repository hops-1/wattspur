apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: io.github.hops-1.wattspur.ios
    intents:
    - metadata:
        name: StartRideIntent_0
        title: Start Ride
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Start a ride with ${+applicationName}'
          - '{${+prefix} }Start ${+applicationName}'
          - '{${+prefix} }Record a ride with ${+applicationName}'
          - '{${+prefix} }Start a ride with ${DeviceEntity} in ${+applicationName}'
          - '{${+prefix} }Start ${+applicationName} with ${DeviceEntity}'
        - locale: de
          utterances:
          - '{${+prefix} }Starte eine Fahrt mit ${+applicationName}'
          - '{${+prefix} }Fahrt starten mit ${+applicationName}'
          - '{${+prefix} }Nimm eine Fahrt mit ${+applicationName} auf'
          - '{${+prefix} }Starte eine Fahrt mit ${DeviceEntity} in ${+applicationName}'
          - '{${+prefix} }Starte ${+applicationName} mit ${DeviceEntity}'
    - metadata:
        name: EndRideIntent_1
        title: End Ride
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }End the ride in ${+applicationName}'
          - '{${+prefix} }Stop ${+applicationName}'
        - locale: de
          utterances:
          - '{${+prefix} }Beende die Fahrt in ${+applicationName}'
          - '{${+prefix} }Fahrt beenden mit ${+applicationName}'
    - metadata:
        name: WeekDistanceIntent_2
        title: Distance This Week
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }How far did I ride this week in ${+applicationName}'
          - '{${+prefix} }My week in ${+applicationName}'
        - locale: de
          utterances:
          - '{${+prefix} }Wie viele Kilometer diese Woche in ${+applicationName}'
          - '{${+prefix} }Meine Woche in ${+applicationName}'
    - metadata:
        name: OpenLastRideIntent_3
        title: Open Last Ride
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Open my last ride in ${+applicationName}'
          - '{${+prefix} }Show my last ride in ${+applicationName}'
        - locale: de
          utterances:
          - '{${+prefix} }Öffne meine letzte Fahrt in ${+applicationName}'
          - '{${+prefix} }Letzte Fahrt in ${+applicationName} öffnen'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
        - locale: de
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - Wattspur
  - locale: de
    synomyms:
    - Wattspur
- name: DeviceEntity
  type: ssu/parameter
  definitions:
  - locale: en
    synomyms:
    - Device
  - locale: de
    synomyms:
    - Gerät
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: de
    synomyms:
      $ref: ssu://Resources/prefix/de.yaml
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: de
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/de.yaml
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
