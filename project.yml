# Xcode project definition. Generate the project with:  xcodegen generate
name: Wattspur
options:
  bundleIdPrefix: io.github.hops-1
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The versions: the Mac's in Config/Mac.xcconfig, the iPhone's (app and widgets) in
    # Config/iOS.xcconfig, each in one place (R-04, R-12).
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  WattspurKit:
    path: Packages/WattspurKit
targets:
  Wattspur:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Wattspur.icon
      # Icon Composer document (macOS 26 Liquid Glass icon), compiled by actool (B-046)
      - path: App/Wattspur.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: WattspurKit
      # The maps, shared with the iPhone from 0.6 on (B-186).
      - package: WattspurKit
        product: WattspurMap
    configFiles:
      Debug: Config/Mac.xcconfig
      Release: Config/Mac.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hops-1.wattspur
        PRODUCT_NAME: Wattspur
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wattspur
        ASSETCATALOG_COMPILER_APPICON_NAME: Wattspur
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Nils Wiese"
        # Signing and entitlements: Config/Mac.xcconfig, ad hoc unless the ignored Config/Local.xcconfig
        # switches to the developer account (NFR-18, B-215, docs/RELEASE.md).
        ENABLE_HARDENED_RUNTIME: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # The git commit for the About window: a pre-build script writes it into a
        # header, which is used when the Info.plist is generated (no change after signing).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREFIX_HEADER: $(DERIVED_FILE_DIR)/WattspurGitInfo.h
    preBuildScripts:
      - &gitCommitScript
        name: Write git commit header
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/WattspurGitInfo.h
        script: |
          COMMIT=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo unknown)
          if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then COMMIT="${COMMIT}-dirty"; fi
          mkdir -p "$DERIVED_FILE_DIR"
          echo "#define WATTSPUR_GIT_COMMIT $COMMIT" > "$DERIVED_FILE_DIR/WattspurGitInfo.h"
  # The iPhone app (B-204, iOS 0.x with its own version numbers). It uses only the package and
  # resources from App/ (sample ride, icon), never Swift files from App/ (docs/ARCHITECTURE.md).
  Wattspur iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      # Shared with the widget extension: the Live Activity's data and its Pause button (B-223).
      - path: iOSShared
      - path: App/SampleRide.fit
        type: file
        buildPhase: resources
      - path: App/Wattspur.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: WattspurKit
      # Embedded in the app: Live Activity of a recording (B-223) and the widget “This Week” (B-224).
      - target: Wattspur Widgets
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hops-1.wattspur.ios
        # Live Activity while recording (B-223).
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        PRODUCT_NAME: Wattspur
        # iPhone only for now; iPad later
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wattspur
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Portrait and both landscape sides for handlebar mounts (B-243); not upside down.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Nils Wiese"
        ASSETCATALOG_COMPILER_APPICON_NAME: Wattspur
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # GPS recording (V-14, B-211): asks for “While Using”; the background mode is in Config/iOS-Info.plist.
        # Files of the app, e.g. the raw motion data (V-16), are in “On My iPhone › Wattspur” in the Files
        # app (together with UIFileSharingEnabled in Config/iOS-Info.plist).
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # Encryption only through Apple's APIs (HTTPS, CloudKit): no export question on every TestFlight upload (B-219).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Wattspur records your ride with GPS, also while the screen is locked."
        # Height from the barometer while recording (B-235); without it the GPS height is used.
        INFOPLIST_KEY_NSMotionUsageDescription: "Wattspur measures the height of your ride with the barometer, and acceleration and lean angle with the motion sensors."
        # Signing: Config/iOS.xcconfig, the team comes from the ignored Config/Local.xcconfig.
        # The git commit for the overview, the same way as on the Mac.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: Config/iOS-Info.plist
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREFIX_HEADER: $(DERIVED_FILE_DIR)/WattspurGitInfo.h
    preBuildScripts:
      - *gitCommitScript
  # Widget extension of the iPhone app (B-223, B-224). Its version must match the app's; both take it
  # from Config/iOS.xcconfig (R-04).
  Wattspur Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iOSWidgets
      - path: iOSShared
    dependencies:
      # The week math of the widget (B-224, `WeekSnapshot`); no SwiftData in the extension.
      - package: WattspurKit
        product: WattspurCore
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hops-1.wattspur.ios.widgets
        PRODUCT_NAME: WattspurWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/iOS-Widgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Wattspur
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Nils Wiese"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
        # Only the App Group shared with the app (B-224), no iCloud.
        CODE_SIGN_ENTITLEMENTS: iOSWidgets/WattspurWidgets.entitlements
schemes:
  Wattspur iOS:
    build:
      targets:
        Wattspur iOS: all
  Wattspur:
    build:
      targets:
        Wattspur: all
    test:
      targets:
        - package: WattspurKit/WattspurKitTests
