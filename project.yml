# Xcode project definition. Generate the project with:  xcodegen generate
name: Wattspur
options:
  bundleIdPrefix: io.github.hops-1
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.8.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  WattspurKit:
    path: Packages/WattspurKit
targets:
  Wattspur:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Wattspur.icon
      # Icon Composer document (macOS 26 Liquid Glass icon), compiled by actool (B-046)
      - path: App/Wattspur.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: WattspurKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hops-1.wattspur
        PRODUCT_NAME: Wattspur
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wattspur
        ASSETCATALOG_COMPILER_APPICON_NAME: Wattspur
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Nils Wiese"
        CODE_SIGN_ENTITLEMENTS: App/Wattspur.entitlements
        # Ad-hoc signing until a developer account exists (NFR-18)
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # The git commit for the About window: a pre-build script writes it into a
        # header, which is used when the Info.plist is generated (no change after signing).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREFIX_HEADER: $(DERIVED_FILE_DIR)/WattspurGitInfo.h
    preBuildScripts:
      - &gitCommitScript
        name: Write git commit header
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/WattspurGitInfo.h
        script: |
          COMMIT=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo unknown)
          if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then COMMIT="${COMMIT}-dirty"; fi
          mkdir -p "$DERIVED_FILE_DIR"
          echo "#define WATTSPUR_GIT_COMMIT $COMMIT" > "$DERIVED_FILE_DIR/WattspurGitInfo.h"
  # The iPhone app (B-204, iOS 0.x with its own version numbers). It uses only the package and
  # resources from App/ (sample ride, icon), never Swift files from App/ (docs/ARCHITECTURE.md).
  Wattspur iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: App/SampleRide.fit
        type: file
        buildPhase: resources
      - path: App/Wattspur.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: WattspurKit
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hops-1.wattspur.ios
        PRODUCT_NAME: Wattspur
        MARKETING_VERSION: "0.2.0"
        # iPhone only for now; iPad later
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wattspur
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Nils Wiese"
        ASSETCATALOG_COMPILER_APPICON_NAME: Wattspur
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # GPS recording (V-14, B-211): asks for “While Using”; the background mode is in Config/iOS-Info.plist.
        # Recordings without a chosen folder are in “On My iPhone › Wattspur” in the Files app (B-211,
        # together with UIFileSharingEnabled in Config/iOS-Info.plist).
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Wattspur records your ride with GPS, also while the screen is locked."
        # Signing: Config/iOS.xcconfig, the team comes from the ignored Config/Local.xcconfig.
        # The git commit for the overview, the same way as on the Mac.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: Config/iOS-Info.plist
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREFIX_HEADER: $(DERIVED_FILE_DIR)/WattspurGitInfo.h
    preBuildScripts:
      - *gitCommitScript
schemes:
  Wattspur iOS:
    build:
      targets:
        Wattspur iOS: all
  Wattspur:
    build:
      targets:
        Wattspur: all
    test:
      targets:
        - package: WattspurKit/WattspurKitTests
